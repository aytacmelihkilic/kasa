name: kasa
description: Annemin Seramik Kataloğu - Basit ve kolay kullanımlı dijital fiyat defteri.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Veritabanı ───────────────────────────────────────────────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ── Görsel İşleme ─────────────────────────────────────────────────────────────
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # ── Ses ile Arama ─────────────────────────────────────────────────────────────
  speech_to_text: ^7.0.0

  # ── Yedekleme & Paylaşım ──────────────────────────────────────────────────────
  share_plus: ^10.1.4
  file_picker: ^8.1.7

  # ── Yardımcı ──────────────────────────────────────────────────────────────────
  uuid: ^4.5.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
